app-template:
  controllers:
    main:
      containers:
        main:
          env:
            - name: CHROMIUM_FLAGS
              value: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-accelerated-2d-canvas --no-first-run --no-zygote --disable-gpu --disable-software-rasterizer --remote-debugging-address=0.0.0.0 --remote-debugging-port=9222"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3080
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 3080
                initialDelaySeconds: 15
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 3

  service:
    main:
      ports:
        http:
          port: 3080
        chromium:
          port: 9222

  configMaps:
    config:
      data:
        openclaw.json: |
          {
            "browser": {
              "enabled": true,
              "defaultProfile": "openclaw",
              "profiles": {
                "openclaw": {
                  "cdpUrl": "http://localhost:9222"
                }
              }
            }
          }

  persistence:
    dshm:
      enabled: true
      type: emptyDir
      medium: Memory
      sizeLimit: 2Gi
      globalMounts:
        - path: /dev/shm

  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: openclaw.cluster.dphx.eu
          paths:
            - path: /
              pathType: Prefix
              service:
                name: openclaw
                port: 3080
      tls:
        - hosts:
            - openclaw.cluster.dphx.eu
          secretName: openclaw-tls

    chromium:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: chromium.cluster.dphx.eu
          paths:
            - path: /
              pathType: Prefix
              service:
                name: openclaw
                port: 9222
      tls:
        - hosts:
            - chromium.cluster.dphx.eu
          secretName: chromium-tls
